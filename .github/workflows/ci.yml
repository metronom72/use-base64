name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: тесты (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom@31 -> undici@8 нужен zstd из zlib, он появился в Node 22.15.
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: поставить React ${{ matrix.react }}
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - run: npm test

  build:
    name: сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: dist содержит то, что обещает package.json
        run: |
          set -eu
          for f in dist/index.mjs dist/index.cjs dist/index.d.ts; do
            [ -s "$f" ] || { echo "нет или пустой: $f"; exit 1; }
            echo "ок: $f ($(wc -c <"$f") байт)"
          done

      - name: что уедет в npm
        run: npm pack --dry-run
