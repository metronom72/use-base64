# Прогон тестов и сборки на каждый PR.
#
# Зачем: это опубликованный пакет, от которого зависят чужие сборки, и его 72
# теста до сих пор запускались только когда кто-то вспоминал их запустить.
# Проверка, которая не идёт сама, защищает ровно до первого забытого раза.
#
# Матрица по React -- не украшение. peerDependencies обещает `react >=16.8`, а
# тесты годами шли против одной версии (18), и свежая при этом не проверялась
# вовсе. Для библиотеки хуков это то обещание, которое ломается молча: собрать
# её с React 19 может кто угодно, а узнать, что она с ним не работает, -- только
# он же и только в своём приложении.
#
# Нижняя граница peer (16.8) матрицей НЕ покрыта, и это осознанно:
# @testing-library/react@16 требует React 18+, то есть проверить 16.8 нечем без
# второго набора тестов. Граница остаётся заявленной, но непроверенной -- либо
# когда-нибудь сузить peer до >=18, либо завести для неё отдельный прогон.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет прошлый прогон: очередь занимать незачем,
# важен результат последнего коммита.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: тесты (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      # Нужно видеть обе ноги: падение на 19 при зелёной 18 -- это и есть тот
      # ответ, за которым матрица здесь стоит.
      fail-fast: false
      matrix:
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines в package.json требует >=18; берём LTS, на котором пакет и
          # собирается у большинства потребителей.
          node-version: "20"
          cache: npm

      # ci, а не install: лок-файл должен соблюдаться, иначе прогон проверяет
      # не то дерево зависимостей, которое лежит в репозитории.
      - run: npm ci

      # --no-save, чтобы подмена версии не правила package.json и лок-файл:
      # нога матрицы меняет только то, что стоит в node_modules сейчас.
      # Для React 18 шаг всё равно выполняется -- так обе ноги проходят один и
      # тот же путь, и расхождение между ними нельзя списать на разный порядок.
      - name: поставить React ${{ matrix.react }}
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - name: какой React реально стоит
        run: npm ls react react-dom --depth=0 || true

      - run: npm test

  build:
    name: сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Сборка -- отдельная работа, а не хвост тестов: она даёт dist, который и
      # публикуется, и её падение надо видеть отдельно от падения тестов.
      - run: npm run build

      # Пакет объявляет exports на три файла (types/import/require) и список
      # files. Если сборка их не положила, пакет опубликуется битым, а узнается
      # это у потребителя. Проверяем, что все три на месте.
      - name: dist содержит то, что обещает package.json
        run: |
          set -eu
          for f in dist/index.mjs dist/index.cjs dist/index.d.ts; do
            [ -s "$f" ] || { echo "нет или пустой: $f"; exit 1; }
            echo "ок: $f ($(wc -c <"$f") байт)"
          done

      # npm pack --dry-run печатает, что уедет в публикацию. Дешёвая страховка
      # от правки files или .npmignore, которая выкинет dist или затащит лишнее.
      - name: что уедет в npm
        run: npm pack --dry-run
